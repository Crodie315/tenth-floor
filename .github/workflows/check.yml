name: check floors
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: ["pygame==2.6.1", "pygame-ce"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "${{ matrix.lib }}"
      - name: floors keep the contract
        run: python check.py
      - name: only your own files changed
        if: github.event_name == 'pull_request'
        run: python check.py --pr "origin/${{ github.base_ref }}"
